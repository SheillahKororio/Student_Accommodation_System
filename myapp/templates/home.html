{% extends 'base.html' %}
{% load static %}

{% block content %}

<!-- Navigation bar -->
<nav class="navbar">
    <a class="logo" href="{% url 'myapp:home' %}">
        <img src="{% static 'images/logo.png' %}" alt="Student Accommodation logo" width="50" height="50">
        <span>Student Accommodation</span>
    </a>

    <ul>
        <li><a href="{% url 'myapp:home' %}">Home</a></li>
        <li><a href="{% url 'myapp:about' %}">About</a></li>
        <li><a href="{% url 'myapp:accommodation' %}">Accommodation</a></li>
        <li><a href="{% url 'myapp:contact' %}">Contact</a></li>
    </ul>

    <div class="nav-buttons">
        <a href="{% url 'myapp:login' %}" class="login-btn">Login</a>
        <a href="{% url 'myapp:register' %}" class="register-btn">Register</a>
    </div>
</nav>

<!-- Welcome section -->
<section class="hero">
    <h1>Find Your Perfect Student Accommodation</h1>

    <p>
        Discover comfortable, secure and affordable accommodation
        designed for students.
    </p>

    <button>Explore Accommodation</button>
</section>

{% endblock %}
